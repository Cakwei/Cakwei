<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" width="100%" height="230" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#131c31" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.55" />
    </linearGradient>
    <radialGradient id="glowOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.25); }
    }
    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes steamRise1 {
      0% { opacity: 0; transform: translateY(6px) scaleY(0.85); }
      40% { opacity: 0.85; }
      100% { opacity: 0; transform: translateY(-14px) scaleY(1.1); }
    }
    @keyframes steamRise2 {
      0% { opacity: 0; transform: translateY(6px) scaleY(0.85); }
      40% { opacity: 0.7; }
      100% { opacity: 0; transform: translateY(-16px) scaleY(1.1); }
    }
    @keyframes slideIn {
      0% { opacity: 0; transform: translateX(-8px); }
      100% { opacity: 1; transform: translateX(0px); }
    }

    .status-dot {
      transform-origin: 682px 24px;
      animation: pulseDot 2s ease-in-out infinite;
    }
    .cursor {
      animation: blinkCursor 1.1s step-end infinite;
    }
    .icon-zone {
      transform-origin: 665px 136px;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), filter 0.35s ease;
      cursor: pointer;
    }
    .icon-float {
      animation: floatSlow 4s ease-in-out infinite;
    }
    .icon-halo {
      transition: opacity 0.35s ease, transform 0.35s ease;
      transform-origin: 665px 136px;
      opacity: 0.45;
    }
    .icon-zone:hover {
      transform: scale(1.12);
    }
    .icon-zone:hover .icon-halo {
      opacity: 0.9;
      transform: scale(1.15);
    }
    .steam-1 { animation: steamRise1 2.4s ease-in-out infinite; }
    .steam-2 { animation: steamRise2 2.4s ease-in-out infinite 0.8s; }
    .steam-3 { animation: steamRise1 2.4s ease-in-out infinite 1.6s; }
    .icon-zone:hover .steam-1,
    .icon-zone:hover .steam-2,
    .icon-zone:hover .steam-3 {
      animation-duration: 1.3s;
    }
    .line-1 { animation: slideIn 0.5s ease-out both; }
    .line-2 { animation: slideIn 0.5s ease-out 0.1s both; }
    .line-3 { animation: slideIn 0.5s ease-out 0.2s both; }
    .line-4 { animation: slideIn 0.5s ease-out 0.3s both; }
    .line-5 { animation: slideIn 0.5s ease-out 0.4s both; }
  </style>

  <!-- Card background & subtle gradient border -->
  <rect x="1" y="1" width="798" height="228" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Ambient glow behind right emblem -->
  <circle cx="665" cy="132" r="90" fill="url(#glowOrb)" />

  <!-- Top window bar -->
  <path d="M1 15 C1 7.268 7.268 1 15 1 H785 C792.732 1 799 7.268 799 15 V42 H1 V15 Z" fill="#1e293b" opacity="0.65" />
  <line x1="1" y1="42" x2="799" y2="42" stroke="#334155" stroke-width="1" />

  <!-- Window dots -->
  <circle cx="24" cy="22" r="5.5" fill="#ef4444" opacity="0.85" />
  <circle cx="43" cy="22" r="5.5" fill="#f59e0b" opacity="0.85" />
  <circle cx="62" cy="22" r="5.5" fill="#22c55e" opacity="0.85" />

  <!-- Terminal title -->
  <text x="84" y="26" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    charlee@cakwei.dev — about.me
  </text>

  <!-- Status pill -->
  <rect x="668" y="12" width="110" height="22" rx="11" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <circle class="status-dot" cx="682" cy="23" r="4" fill="#22c55e" />
  <text x="693" y="27" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
    chill mode
  </text>

  <!-- Main profile content -->
  <g class="line-1">
    <text x="28" y="76" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">
      Charlee Tan
    </text>
    <text x="165" y="76" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600">
      @cakwei
    </text>
  </g>

  <g class="line-2">
    <text x="28" y="100" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5">
      Aspiring Software Engineer from <tspan fill="#e2e8f0" font-weight="600">APU, Malaysia</tspan>
    </text>
  </g>

  <g class="line-3">
    <text x="28" y="132" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
      &gt; exploring
    </text>
    <text x="132" y="132" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5">
      Desktop apps with <tspan fill="#f8fafc" font-weight="600">Tauri</tspan>
    </text>
  </g>

  <g class="line-4">
    <text x="28" y="158" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
      &gt; building
    </text>
    <text x="132" y="158" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5">
      Full-stack web apps (<tspan fill="#e2e8f0">TypeScript, React, Node.js</tspan>)
    </text>
  </g>

  <g class="line-5">
    <text x="28" y="184" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
      &gt; fun_fact
    </text>
    <text x="132" y="184" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5">
      Way too chill on the outside
    </text>
    <rect class="cursor" x="318" y="172" width="7" height="14" rx="1" fill="#38bdf8" />
  </g>

  <text x="28" y="210" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">
    cakwei.dev  •  charlee@cakwei.dev
  </text>

  <!-- Right animated chill coffee-and-code icon (reactive on hover in standalone SVG view) -->
  <g class="icon-zone">
    <!-- Generous invisible hit area for proximity hover -->
    <circle cx="665" cy="136" r="72" fill="transparent" />

    <!-- Subtle glow ring -->
    <circle class="icon-halo" cx="665" cy="136" r="50" fill="#0ea5e9" fill-opacity="0.12" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />

    <g class="icon-float">
      <!-- Rising steam -->
      <path class="steam-1" d="M649 108 C646 101, 653 95, 649 88" stroke="#7dd3fc" stroke-width="2.2" stroke-linecap="round" />
      <path class="steam-2" d="M663 105 C660 98, 667 91, 663 84" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" />
      <path class="steam-3" d="M677 108 C674 101, 681 95, 677 88" stroke="#7dd3fc" stroke-width="2.2" stroke-linecap="round" />

      <!-- Mug handle -->
      <path d="M690 124 H697 C703 124, 707 128, 707 134 V142 C707 148, 703 152, 697 152 H690" stroke="#38bdf8" stroke-width="3.2" stroke-linecap="round" />

      <!-- Mug body -->
      <path d="M638 118 H690 V148 C690 158, 681 166, 671 166 H657 C647 166, 638 158, 638 148 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round" />

      <!-- Coffee liquid rim -->
      <ellipse cx="664" cy="118" rx="26" ry="5" fill="#0f172a" stroke="#7dd3fc" stroke-width="2" />

      <!-- Subtle code brackets on mug -->
      <text x="664" y="147" text-anchor="middle" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">
        { }
      </text>

      <!-- Coaster / saucer -->
      <rect x="631" y="169" width="66" height="5" rx="2.5" fill="#334155" />
    </g>
  </g>
</svg>
